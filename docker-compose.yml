version: "3.8"

services:
  iptv-web:
    build: .
    container_name: iptv-web
    ports:
      - "${IPTV_PORT:-5005}:5005"
    environment:
      - IPTV_PLAYLIST_URL=${IPTV_PLAYLIST_URL:-https://raw.githubusercontent.com/YueChan/Live/main/GNTV.m3u}
      - CLASH_PROXY=${CLASH_PROXY:-http://192.168.1.146:7890}
      - IPTV_LOG_LEVEL=${IPTV_LOG_LEVEL:-INFO}
      - IPTV_RATE_LIMIT=${IPTV_RATE_LIMIT:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
